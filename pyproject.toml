[project]
name = "smart-itinerary-agent"
version = "0.1.0"
description = "Smart Itinerary Planner & Booking Assistant - 100% local multi-agent travel concierge built on Google ADK"
readme = "spec.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk>=2.7.1",
    "google-genai>=2.19.0",
    "structlog>=26.1.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
